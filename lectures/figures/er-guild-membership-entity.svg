<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Guild membership as an explicit entity</title><desc id="desc">Guild Membership has its own membership_id and exactly one Character and Guild. Every Guild has at least one membership. Each Membership Review concerns exactly one membership; a membership may have zero or many reviews. The character–guild pair remains unique.</desc>
