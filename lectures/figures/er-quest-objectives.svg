<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
<title id="title">Quest objectives as weak entities</title>
<desc id="desc">Quest has a solid-underlined quest_id. Quest Objective has a double rectangle and dashed-underlined objective_no. The identifying relationship has_objective is a double diamond pointing to Quest. Both connections are double lines.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b4d}.heading{font-size:21px;font-weight:700}.attribute{font-family:Consolas,monospace;font-size:20px}.relationship{font-size:20px}.note{font-size:19px;fill:#475569}</style>
<rect width="1000" height="280" fill="#ffffff"/>
<rect x="25" y="45" width="220" height="150" fill="#fff" stroke="#344955" stroke-width="2"/>
<rect x="26" y="46" width="218" height="44" fill="#eaf4f7"/>
<path d="M25 90 H245" stroke="#344955" stroke-width="2"/>
<text x="135.0" y="75" class="heading" text-anchor="middle" >QUEST</text>
<text x="45" y="122" class="attribute" text-anchor="start" text-decoration="underline">quest_id</text>
<text x="45" y="153" class="attribute" text-anchor="start" >title</text>
<rect x="700" y="35" width="280" height="175" fill="#fff" stroke="#344955" stroke-width="2"/>
<rect x="706" y="41" width="268" height="163" fill="none" stroke="#344955" stroke-width="2"/>
<rect x="707" y="42" width="266" height="38" fill="#eaf4f7"/>
<path d="M706 80 H974" stroke="#344955" stroke-width="2"/>
<text x="840.0" y="65" class="heading" text-anchor="middle" >QUEST_OBJECTIVE</text>
<text x="720" y="112" class="attribute" text-anchor="start" >objective_no</text>
<path d="M720 117 h144" fill="none" stroke="#173b4d" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="720" y="143" class="attribute" text-anchor="start" >description</text>
<polygon points="360,120 470,66 580,120 470,174" fill="#f7f3ea" stroke="#344955" stroke-width="2"/>
<polygon points="370,120 470,72 570,120 470,168" fill="none" stroke="#344955" stroke-width="2"/>
<text x="470" y="127" class="relationship" text-anchor="middle" >has_objective</text>
<polygon points="245,120 259.0,113.5 259.0,126.5" fill="#344955"/>
<path d="M360,124 L259,124" fill="none" stroke="#344955" stroke-width="2"/>
<path d="M360,116 L259,116" fill="none" stroke="#344955" stroke-width="2"/>
<path d="M580,116 L700,116" fill="none" stroke="#344955" stroke-width="2"/>
<path d="M580,124 L700,124" fill="none" stroke="#344955" stroke-width="2"/>
<text x="500" y="253" class="note" text-anchor="middle" >Complete identity: (quest_id, objective_no)</text>
</svg>
