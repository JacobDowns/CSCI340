<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="485" viewBox="0 0 1000 485" role="img" aria-labelledby="title desc"><title id="title">Two notations for current location</title><desc id="desc">Equivalent arrow and minimum-maximum diagrams. Each character has exactly one current location; a location has zero or more characters.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b4d}.heading{font-size:22px;font-weight:700}.relationship{font-size:20px}.attribute{font-family:Consolas,monospace;font-size:19px}.label{font-family:Consolas,monospace;font-size:25px;font-weight:700}.note{font-size:19px;fill:#475569}</style><rect width="1000" height="485" fill="#fff"/><text x="30" y="32" class="heading">Arrow and participation notation</text><rect x="30" y="62" width="245" height="100" fill="#fff" stroke="#344955" stroke-width="2"/><rect x="31" y="63" width="243" height="43" fill="#eaf4f7"/><path d="M30 107 h245" stroke="#344955" stroke-width="2"/><text x="152.5" y="92" class="heading" text-anchor="middle">CHARACTER</text><text x="50" y="139" class="attribute" text-decoration="underline">character_id</text><rect x="725" y="62" width="245" height="100" fill="#fff" stroke="#344955" stroke-width="2"/><rect x="726" y="63" width="243" height="43" fill="#eaf4f7"/><path d="M725 107 h245" stroke="#344955" stroke-width="2"/><text x="847.5" y="92" class="heading" text-anchor="middle">LOCATION</text><text x="745" y="139" class="attribute" text-decoration="underline">location_id</text><polygon points="390,112 500,64 610,112 500,160" fill="#f7f3ea" stroke="#344955" stroke-width="2"/><text x="500" y="119" class="relationship" text-anchor="middle">located_in</text><path d="M275 108 H390 M275 116 H390 M610 112 H711" fill="none" stroke="#344955" stroke-width="2"/><polygon points="725,112 711,105 711,119" fill="#344955"/><text x="30" y="217" class="heading">Minimum–maximum notation (textbook convention)</text><rect x="30" y="252" width="245" height="100" fill="#fff" stroke="#344955" stroke-width="2"/><rect x="31" y="253" width="243" height="43" fill="#eaf4f7"/><path d="M30 297 h245" stroke="#344955" stroke-width="2"/><text x="152.5" y="282" class="heading" text-anchor="middle">CHARACTER</text><text x="50" y="329" class="attribute" text-decoration="underline">character_id</text><rect x="725" y="252" width="245" height="100" fill="#fff" stroke="#344955" stroke-width="2"/><rect x="726" y="253" width="243" height="43" fill="#eaf4f7"/><path d="M725 297 h245" stroke="#344955" stroke-width="2"/><text x="847.5" y="282" class="heading" text-anchor="middle">LOCATION</text><text x="745" y="329" class="attribute" text-decoration="underline">location_id</text><polygon points="390,302 500,254 610,302 500,350" fill="#f7f3ea" stroke="#344955" stroke-width="2"/><text x="500" y="309" class="relationship" text-anchor="middle">located_in</text><path d="M275 302 H390 M610 302 H725" fill="none" stroke="#344955" stroke-width="2"/><text x="326" y="283" class="label" text-anchor="middle">1..1</text><text x="674" y="283" class="label" text-anchor="middle">0..*</text><text x="260" y="405" class="note" text-anchor="middle">For one CHARACTER:</text><text x="260" y="433" class="note" text-anchor="middle">exactly one location association</text><text x="740" y="405" class="note" text-anchor="middle">For one LOCATION:</text><text x="740" y="433" class="note" text-anchor="middle">zero or more character associations</text></svg>