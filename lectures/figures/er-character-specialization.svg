<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Character specialization</title><desc id="desc">PlayerCharacter and NonplayerCharacter share a hollow ISA arrow toward Character. The shared arrow denotes disjoint subclasses. Subclasses inherit character_id and name.</desc>
