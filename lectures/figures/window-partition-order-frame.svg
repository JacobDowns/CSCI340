<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640" role="img" aria-labelledby="title desc">
<title id="title">Partition, order, and frame in a sales window</title>
<desc id="desc">Three store partitions each contain five sales rows ordered by date. The current row is ST02 on October 12. Within ST02, a three-row frame contains October 4, 5, and 12, while a seven-day range frame contains October 5 and 12. Neither frame includes rows from other stores.</desc>
