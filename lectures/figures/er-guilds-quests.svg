<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">Guilds, leadership, and quest participation</title>
<desc id="desc">Membership points to Guild; leadership points to both Character and Guild. Guild participation in each is total. Undertakes is optional many-to-many with accepted_at and status. Offers points to Guild and requires every Quest to have an issuer.</desc>
