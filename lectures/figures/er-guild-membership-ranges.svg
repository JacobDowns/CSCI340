<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">Guild membership with a numeric bound</title><desc id="desc">The range 0..* beside CHARACTER allows zero or more guilds per character. The range 2..8 beside GUILD requires two through eight members per guild.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173b4d}.heading{font-size:22px;font-weight:700}.relationship{font-size:20px}.attribute{font-family:Consolas,monospace;font-size:19px}.label{font-family:Consolas,monospace;font-size:25px;font-weight:700}.note{font-size:19px;fill:#475569}</style><rect width="1000" height="250" fill="#fff"/><rect x="30" y="42" width="245" height="100" fill="#fff" stroke="#344955" stroke-width="2"/><rect x="31" y="43" width="243" height="43" fill="#eaf4f7"/><path d="M30 87 h245" stroke="#344955" stroke-width="2"/><text x="152.5" y="72" class="heading" text-anchor="middle">CHARACTER</text><text x="50" y="119" class="attribute" text-decoration="underline">character_id</text><rect x="725" y="42" width="245" height="100" fill="#fff" stroke="#344955" stroke-width="2"/><rect x="726" y="43" width="243" height="43" fill="#eaf4f7"/><path d="M725 87 h245" stroke="#344955" stroke-width="2"/><text x="847.5" y="72" class="heading" text-anchor="middle">GUILD</text><text x="745" y="119" class="attribute" text-decoration="underline">guild_id</text><polygon points="390,92 500,44 610,92 500,140" fill="#f7f3ea" stroke="#344955" stroke-width="2"/><text x="500" y="99" class="relationship" text-anchor="middle">member_of</text><path d="M275 92 H390 M610 92 H725" fill="none" stroke="#344955" stroke-width="2"/><text x="326" y="73" class="label" text-anchor="middle">0..*</text><text x="674" y="73" class="label" text-anchor="middle">2..8</text><text x="260" y="193" class="note" text-anchor="middle">One character: zero or more guilds</text><text x="740" y="193" class="note" text-anchor="middle">One guild: two through eight members</text></svg>