<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">From a PostgreSQL table to the bytes of a row</title>
  <desc id="desc">A table has main heap files containing numbered pages. Zoom into page 42, where slot 2 points to row B. Zoom into B to see its header, optional null bitmap, alignment padding, and column values. All sizes are schematic. Auxiliary storage is omitted.</desc>
  <rect x="1" y="1" width="1098" height="608" rx="12" fill="#fff" stroke="#d7e2e6"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#173b4d">
    <rect x="325" y="20" width="450" height="58" rx="8" fill="#e8edf5" stroke="#b8cbd1"/>
    <text x="550" y="56" text-anchor="middle" font-size="23" font-weight="700">SQL table: storage_demo</text>
    <path d="M550 79 V107" stroke="#275983" stroke-width="2.5"/>
    <path d="M543 102 L550 113 L557 102" fill="#275983"/>

    <rect x="35" y="120" width="1030" height="113" rx="8" fill="#f0f7f9" stroke="#b8cbd1"/>
    <text x="55" y="149" font-size="20" font-weight="700">Main heap storage: numbered pages in file(s)</text>
    <g font-size="19" text-anchor="middle">
      <rect x="65" y="167" width="160" height="46" fill="#fff" stroke="#b8cbd1"/>
      <text x="145" y="197">Page 0</text>
      <rect x="225" y="167" width="160" height="46" fill="#fff" stroke="#b8cbd1"/>
      <text x="305" y="197">Page 1</text>
      <rect x="385" y="167" width="160" height="46" fill="#fff" stroke="#b8cbd1"/>
      <text x="465" y="197">…</text>
      <rect x="545" y="167" width="240" height="46" fill="#d7eafa" stroke="#275983" stroke-width="2"/>
      <text x="665" y="197" font-weight="700">Page 42</text>
      <rect x="785" y="167" width="250" height="46" fill="#fff" stroke="#b8cbd1"/>
      <text x="910" y="197">… more pages</text>
    </g>
    <path d="M665 214 V264" stroke="#275983" stroke-width="2.5"/>
    <path d="M658 258 L665 269 L672 258" fill="#275983"/>
    <text x="682" y="257" font-size="16">Zoom into page 42</text>

    <rect x="35" y="277" width="1030" height="133" rx="8" fill="#f0f7f9" stroke="#b8cbd1"/>
    <text x="55" y="306" font-size="20" font-weight="700">One heap page: slots locate rows</text>
    <g font-size="17" text-anchor="middle">
      <rect x="65" y="323" width="150" height="49" fill="#e8edf5" stroke="#b8cbd1"/>
      <text x="140" y="354">Page header</text>
      <rect x="215" y="323" width="75" height="49" fill="#fff" stroke="#b8cbd1"/>
      <text x="252.5" y="354">Slot 1</text>
      <rect x="290" y="323" width="75" height="49" fill="#d7eafa" stroke="#275983" stroke-width="2"/>
      <text x="327.5" y="354" font-weight="700">Slot 2</text>
      <rect x="365" y="323" width="75" height="49" fill="#fff" stroke="#b8cbd1"/>
      <text x="402.5" y="354">Slot 3</text>
      <rect x="440" y="323" width="235" height="49" fill="#fff" stroke="#b8cbd1" stroke-dasharray="5 3"/>
      <text x="557.5" y="354">Free space</text>
      <rect x="675" y="323" width="120" height="49" fill="#fff" stroke="#b8cbd1"/>
      <text x="735" y="354">Row C</text>
      <rect x="795" y="323" width="120" height="49" fill="#d7eafa" stroke="#275983" stroke-width="2"/>
      <text x="855" y="354" font-weight="700">Row B</text>
      <rect x="915" y="323" width="120" height="49" fill="#fff" stroke="#b8cbd1"/>
      <text x="975" y="354">Row A</text>
    </g>
    <path d="M327.5 373 V392 H855 V379" fill="none" stroke="#275983" stroke-width="2"/>
    <path d="M849 383 L855 373 L861 383" fill="#275983"/>
    <path d="M855 411 V446" stroke="#275983" stroke-width="2.5"/>
    <path d="M848 440 L855 451 L862 440" fill="#275983"/>
    <text x="872" y="438" font-size="16">Zoom into row B</text>

    <rect x="35" y="458" width="1030" height="111" rx="8" fill="#f0f7f9" stroke="#b8cbd1"/>
    <text x="55" y="487" font-size="20" font-weight="700">One row: metadata followed by column values</text>
    <g font-size="17" text-anchor="middle">
      <rect x="65" y="504" width="190" height="45" fill="#e8edf5" stroke="#b8cbd1"/>
      <text x="160" y="533">Row header</text>
      <rect x="255" y="504" width="210" height="45" fill="#e8edf5" stroke="#b8cbd1"/>
      <text x="360" y="533">Optional null bitmap</text>
      <rect x="465" y="504" width="120" height="45" fill="#e8edf5" stroke="#b8cbd1"/>
      <text x="525" y="533">Padding</text>
      <rect x="585" y="504" width="450" height="45" fill="#d7eafa" stroke="#275983"/>
      <text x="810" y="533">event_id · player_id · score · note</text>
    </g>
    <text x="35" y="594" font-size="16" fill="#475569">Schematic widths. Indexes and auxiliary storage are separate; padding may also occur between values.</text>
  </g>
</svg>
