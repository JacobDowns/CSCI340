<polygon points="425,290 510,245 595,290 510,335" fill="#f7f3ea" stroke="#344955" stroke-width="2"/>
<text x="510" y="297" class="relationship" text-anchor="middle" >carries</text>
<path d="M280,141 L415,141" fill="none" stroke="#344955" stroke-width="2"/>
<path d="M280,149 L415,149" fill="none" stroke="#344955" stroke-width="2"/>
<polygon points="760,145 746.0,151.5 746.0,138.5" fill="#344955"/>
<path d="M605,145 L746,145" fill="none" stroke="#344955" stroke-width="2"/>
<polygon points="280,290 294.0,283.5 294.0,296.5" fill="#344955"/>
