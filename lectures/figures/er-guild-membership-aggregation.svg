<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Aggregation of guild membership</title><desc id="desc">A boundary encloses Character, member_of and Guild. The membership relationship is many-to-many; Guild has total participation. Membership Review connects through reviews to this aggregate, and each review concerns exactly one membership. A membership may have no reviews or several.</desc>
