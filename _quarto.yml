project:
  type: website
  output-dir: _site
  resources:
    - "notebooks/assignment-01-relational-operators-starter.ipynb"
  render:
    - "index.qmd"
    - "schedule.qmd"
    - "resources.qmd"
    - "activities/*.qmd"
    - "lectures/*.qmd"
    - "assignments/*.qmd"
    - "projects/*.qmd"

website:
  title: "CSCI 340 | Database Systems and Data Management"
  description: "Course materials for learning how to model, query, validate, optimize, and analyze data."
  site-url: "https://JacobDowns.github.io/CSCI340/"
  repo-url: "https://github.com/JacobDowns/CSCI340"
  page-navigation: true
  reader-mode: true
  search: true
  navbar:
    background: primary
    left:
      - text: Home
        href: index.qmd
      - text: Schedule
        href: schedule.qmd
      - text: Lectures
        href: lectures/index.qmd
      - text: Labs
        href: activities/index.qmd
      - text: Project
        href: projects/capstone.qmd
  sidebar:
    style: docked
    search: true
    contents:
      - section: Course
        contents:
          - schedule.qmd
          - resources.qmd
      - section: Lectures
        contents:
          - lectures/index.qmd
          - lectures/week-01-database-or-spreadsheet.qmd
          - lectures/week-02-from-tables-to-relations.qmd
          - lectures/week-02-relational-algebra.qmd
          - lectures/week-03-asking-questions-with-sql.qmd
      - section: Labs and activities
        contents:
          - activities/index.qmd
          - activities/week-01-tool-choice-discussion.qmd
          - activities/week-01-file-representation-lab.qmd
          - activities/week-02-query-reasoning-lab.qmd
      - section: Assignments
        contents:
          - assignments/index.qmd
          - assignments/assignment-01-relational-operators.qmd
          - projects/capstone.qmd
  page-footer:
    left: "CSCI 340 | Database Systems and Data Management"
    right: "Built with Quarto"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    include-in-header: includes/sidebar-toggle.html
    toc: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    link-external-newwindow: true

execute:
  freeze: auto
